<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #212121; color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; border-bottom: 1px solid #333;
        }
        .topbar h2 { font-size: 15px; font-weight: 500; color: #bbb; }
        .doc-count {
            font-size: 13px; color: #777;
            background: #2a2a2a; padding: 4px 12px; border-radius: 20px;
        }
        .chat-area {
            flex: 1; overflow-y: auto; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .welcome { text-align: center; margin-top: 15vh; }
        .welcome h1 { font-size: 28px; font-weight: 400; margin-bottom: 8px; }
        .welcome p { color: #777; font-size: 14px; }

        .messages { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px; }
        .msg { display: flex; flex-direction: column; gap: 6px; }
        .msg-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .msg.user .msg-label { color: #888; }
        .msg.bot .msg-label { color: #6b9f6b; }
        .msg-body { font-size: 15px; line-height: 1.7; color: #d4d4d4; white-space: pre-wrap; }
        .msg.user .msg-body { color: #fff; }

        .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        .sources-title { width: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; }
        .source-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background: #2a2a2a; border: 1px solid #333;
            border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #999;
        }
        .source-tag .fname { color: #bbb; font-weight: 500; }

        .thinking { display: flex; gap: 4px; padding: 8px 0; }
        .thinking span { width: 6px; height: 6px; background: #555; border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
        .thinking span:nth-child(2) { animation-delay: 0.15s; }
        .thinking span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes pulse { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }

        .progress-box {
            display: none; width: 100%; max-width: 720px;
            margin-bottom: 20px;
        }
        .progress-box.show { display: block; }
        .progress-label { font-size: 13px; color: #8bc48b; margin-bottom: 8px; }
        .progress-track {
            width: 100%; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #6b9f6b; border-radius: 4px;
            transition: width 0.3s ease; width: 0%;
        }
        .progress-percent { font-size: 12px; color: #777; margin-top: 6px; text-align: right; }

        .status-bar {
            display: none; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px;
            width: 100%; max-width: 720px; font-size: 13px;
        }
        .status-bar.info { background: #1a2e1a; border: 1px solid #2d4a2d; color: #8bc48b; }
        .status-bar.error { background: #2e1a1a; border: 1px solid #4a2d2d; color: #c48b8b; }
        .status-bar.show { display: block; }

        .file-chips {
            display: flex; flex-wrap: wrap; gap: 6px;
            max-width: 720px; width: 100%; margin: 0 auto; padding: 0 20px 6px;
        }
        .file-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: #2a2a2a; border: 1px solid #3a3a3a;
            border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #aaa;
        }
        .file-chip .remove { cursor: pointer; color: #666; font-size: 14px; }
        .file-chip .remove:hover { color: #ff6b6b; }

        .input-area { padding: 16px 20px 24px; display: flex; justify-content: center; }
        .input-box {
            width: 100%; max-width: 720px; display: flex; align-items: center;
            background: #303030; border: 1px solid #444;
            border-radius: 24px; padding: 4px 6px 4px 4px; transition: border-color 0.2s;
        }
        .input-box:focus-within { border-color: #666; }

        .upload-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: #444; color: #ccc; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .upload-btn:hover { background: #555; }
        #file-input { display: none; }
        .text-input {
            flex: 1; background: none; border: none; outline: none;
            color: #e0e0e0; font-size: 15px; padding: 8px 12px;
            font-family: inherit; resize: none; max-height: 120px; line-height: 1.4;
        }
        .text-input::placeholder { color: #777; }
        .send-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: #fff; color: #212121; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .send-btn:disabled { opacity: 0.3; cursor: default; }
        .send-btn svg { width: 16px; height: 16px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>

<div class="topbar">
    <h2>RAG Search</h2>
    <span class="doc-count" id="doc-count">0 documents</span>
</div>

<div class="chat-area" id="chat-area">
    <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>
        <p>Upload PDFs and ask questions about them</p>
    </div>

    <div class="progress-box" id="progress-box">
        <div class="progress-label" id="progress-label">processing...</div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-percent" id="progress-percent">0%</div>
    </div>

    <div class="status-bar" id="status-bar"></div>
    <div class="messages" id="messages"></div>
</div>

<div class="file-chips" id="file-chips"></div>

<div class="input-area">
    <div class="input-box">
        <button class="upload-btn" id="upload-btn" title="Upload PDFs">+</button>
        <input type="file" id="file-input" multiple accept=".pdf">
        <textarea class="text-input" id="text-input" placeholder="Ask anything" rows="1"></textarea>
        <button class="send-btn" id="send-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chatArea = $("chat-area"), messages = $("messages"), welcome = $("welcome");
const input = $("text-input"), sendBtn = $("send-btn");
const uploadBtn = $("upload-btn"), fileInput = $("file-input");
const fileChips = $("file-chips"), statusBar = $("status-bar"), docCount = $("doc-count");
const progressBox = $("progress-box"), progressLabel = $("progress-label");
const progressFill = $("progress-fill"), progressPercent = $("progress-percent");

let polling = false;

// get doc count on load
fetch("/documents").then(r => r.json()).then(d => {
    docCount.textContent = d.count + " document" + (d.count !== 1 ? "s" : "");
}).catch(() => {});

// auto-resize textarea
input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

// enter to send
input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
});

// click to send
sendBtn.addEventListener("click", () => {
    handleSend();
});

// file upload button
uploadBtn.addEventListener("click", () => fileInput.click());

// when files are selected, upload immediately
fileInput.addEventListener("change", async () => {
    const files = fileInput.files;
    if (!files.length) return;

    const fd = new FormData();
    let count = 0;

    for (let i = 0; i < files.length; i++) {
        if (files[i].name.toLowerCase().endsWith(".pdf")) {
            fd.append("files", files[i]);
            count++;
        }
    }

    if (count === 0) return;

    fileInput.value = "";

    // start progress polling
    startProgressPoll();

    try {
        const res = await fetch("/upload", { method: "POST", body: fd });
        const data = await res.json();

        stopProgressPoll();

        if (data.ok) {
            showStatus(data.msg);
            docCount.textContent = data.doc_count + " document" + (data.doc_count !== 1 ? "s" : "");
            setTimeout(hideStatus, 4000);
        } else {
            showStatus(data.msg, true);
        }
    } catch (e) {
        stopProgressPoll();
        showStatus("upload failed: " + e.message, true);
    }
});

// progress bar
function startProgressPoll() {
    polling = true;
    progressBox.classList.add("show");
    pollProgress();
}

function pollProgress() {
    if (!polling) return;
    fetch("/progress").then(r => r.json()).then(d => {
        progressLabel.textContent = d.step;
        progressFill.style.width = d.percent + "%";
        progressPercent.textContent = d.percent + "%";
        if (!d.done) setTimeout(pollProgress, 500);
    }).catch(() => { if (polling) setTimeout(pollProgress, 1000); });
}

function stopProgressPoll() {
    polling = false;
    progressFill.style.width = "100%";
    progressPercent.textContent = "100%";
    progressLabel.textContent = "done!";
    setTimeout(() => { progressBox.classList.remove("show"); }, 2000);
}

// send question
async function handleSend() {
    const question = input.value.trim();
    if (!question) return;

    // disable button while processing
    sendBtn.disabled = true;

    welcome.style.display = "none";

    addMsg("user", question);
    input.value = "";
    input.style.height = "auto";

    const loader = addThinking();

    try {
        const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
        });

        const data = await res.json();
        loader.remove();
        addMsg("bot", data.answer, data.sources);
    } catch (e) {
        loader.remove();
        addMsg("bot", "error: " + e.message);
    }

    // always re-enable
    sendBtn.disabled = false;
}

// add message to chat
function addMsg(role, text, sources) {
    const div = document.createElement("div");
    div.className = "msg " + role;

    let h = '<div class="msg-label">' + (role === "user" ? "You" : "Answer") + '</div>';
    h += '<div class="msg-body">' + esc(text) + '</div>';

    if (sources && sources.length) {
        h += '<div class="sources"><div class="sources-title">Sources</div>';
        sources.forEach(s => {
            let info = 'chunk ' + s.chunk_id;
            if (s.page) info = 'page ' + s.page + ' \u00B7 ' + info;
            info += ' \u00B7 ' + s.score;

            h += '<div class="source-tag"><span class="fname">' + esc(s.filename) +
                '</span><span>' + info + '</span></div>';
        });
        h += '</div>';
    }

    div.innerHTML = h;
    messages.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

// thinking animation
function addThinking() {
    const d = document.createElement("div");
    d.className = "msg bot";
    d.innerHTML = '<div class="msg-label">Answer</div><div class="thinking"><span></span><span></span><span></span></div>';
    messages.appendChild(d);
    chatArea.scrollTop = chatArea.scrollHeight;
    return d;
}

// status bar
function showStatus(msg, err) {
    statusBar.textContent = msg;
    statusBar.className = "status-bar show " + (err ? "error" : "info");
}
function hideStatus() { statusBar.className = "status-bar"; }

// escape html
function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
}
</script>
</body>
</html>
